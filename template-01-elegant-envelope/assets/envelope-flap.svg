<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="flap-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="1.5">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <linearGradient id="flap-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="1"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <path d="M8 0 L292 0 L270 180 L30 180 Z" fill="url(#flap-gradient)" filter="url(#flap-texture)"/>
  <!-- Seal landing zone indicator (subtle) -->
  <ellipse cx="150" cy="165" rx="35" ry="12" fill="currentColor" opacity="0.05"/>
</svg>