<svg viewBox="0 0 300 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="paper-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <pattern id="linen" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="currentColor" opacity="0.03"/>
      <path d="M0 2h4M2 0v4" stroke="currentColor" stroke-width="0.5" opacity="0.02"/>
    </pattern>
  </defs>
  <rect width="300" height="480" rx="8" fill="var(--color-surface)" filter="url(#paper-texture)"/>
  <rect width="300" height="480" rx="8" fill="url(#linen)"/>
  <!-- Subtle edge highlight -->
  <path d="M8 8h284v464H8z" fill="none" stroke="var(--color-on-surface)" stroke-width="0.5" opacity="0.05"/>
</svg>