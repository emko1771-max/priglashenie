<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wax-gradient" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E8D5B7"/>
      <stop offset="40%" stop-color="#C9A962"/>
      <stop offset="70%" stop-color="#B8954F"/>
      <stop offset="100%" stop-color="#9A7A3A"/>
    </radialGradient>
    <radialGradient id="wax-highlight" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="wax-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>
  <!-- Seal base -->
  <circle cx="60" cy="60" r="55" fill="url(#wax-gradient)" filter="url(#wax-depth)"/>
  <!-- Highlight -->
  <circle cx="60" cy="60" r="55" fill="url(#wax-highlight)"/>
  <!-- Monogram placeholder - replaced at runtime -->
  <g id="monogram-slot" transform="translate(60 60) scale(0.8)">
    <!-- Injected: <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="Playfair Display" font-size="40" fill="#9A7A3A">{{MONOGRAM}}</text> -->
  </g>
  <!-- Optional crack lines for animation -->
  <g id="seal-cracks" opacity="0" stroke="#9A7A3A" stroke-width="1.5" fill="none">
    <path d="M60 20 Q65 40 60 60 Q55 80 60 100"/>
    <path d="M20 60 Q40 55 60 60 Q80 65 100 60"/>
    <path d="M35 35 Q50 50 60 60 Q70 70 85 85"/>
  </g>
</svg>