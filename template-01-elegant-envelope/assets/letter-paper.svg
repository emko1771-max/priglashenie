<svg viewBox="0 0 280 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="letter-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="1">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <pattern id="ruled-lines" patternUnits="userSpaceOnUse" width="280" height="40">
      <line x1="20" y1="40" x2="260" y2="40" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="280" height="440" rx="6" fill="var(--color-surface)" filter="url(#letter-texture)"/>
  <rect width="280" height="440" rx="6" fill="url(#ruled-lines)"/>
  <!-- Top decorative border -->
  <path d="M20 40 L260 40" stroke="var(--color-tertiary)" stroke-width="1" opacity="0.3"/>
</svg>